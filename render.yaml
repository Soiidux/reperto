# Render blueprint — the backend Dockerfile already serves the built SPA, so the
# whole app deploys as a single web service.
#
#   1. Create a Render blueprint pointed at this repository.
#   2. Set the environment variables below in the dashboard (marked sync:false),
#      especially MONGODB_URI and JWT_SECRET.
#   3. On first deploy, seed demo data with:
#        docker compose run --rm seed      (locally, against the same database)
#
# The API is a private service; MongoDB Atlas is expected rather than run from
# this compose file, so no in-cluster database is declared here.

services:
  - type: web
    name: reperto-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health/ready
    # TERM then a short grace period: index.ts logs and exits cleanly, and the
    # reminders' in-process lock expires on its own if a run is interrupted.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      # Same-origin SPA, so this must match the service's own public URL.
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Leave RESEND_API_KEY empty to use the console mail transport.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: LOG_LEVEL
        value: info